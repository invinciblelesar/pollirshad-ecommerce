<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - পল্লীর স্বাদ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- Login Screen -->
    <div id="loginScreen" class="absolute inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-96 max-w-[90%]">
            <div class="text-center mb-6">
                <i class="fas fa-store text-4xl text-[#2d5a27] mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">অ্যাডমিন লগইন</h2>
            </div>
            
            <input type="text" id="adminUser" placeholder="ইউজারনেম (Username)" class="w-full mb-4 p-3 border border-gray-300 rounded focus:outline-none focus:border-[#2d5a27] focus:ring-1 focus:ring-[#2d5a27] bg-gray-50">
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড (Password)" class="w-full mb-6 p-3 border border-gray-300 rounded focus:outline-none focus:border-[#2d5a27] focus:ring-1 focus:ring-[#2d5a27] bg-gray-50">
            
            <button onclick="adminLogin()" class="w-full bg-[#2d5a27] text-white py-3 rounded font-bold hover:bg-green-800 transition duration-200 shadow-md">
                লগইন করুন
            </button>
        </div>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden md:hidden"></div>

    <!-- Dashboard Sidebar -->
    <div id="sidebar" class="w-64 bg-gray-900 text-white flex-col fixed md:relative h-full z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex shadow-xl">
        <div class="p-5 text-2xl font-bold border-b border-gray-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-store text-[#e76f51]"></i> <span class="text-lg">পল্লীর স্বাদ</span>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="#" class="block py-3 px-4 bg-gray-800 rounded text-sm font-semibold border-l-4 border-[#e76f51] transition-colors">
                <i class="fas fa-chart-line w-5"></i> ড্যাশবোর্ড
            </a>
            <a href="#" class="block py-3 px-4 hover:bg-gray-800 rounded text-sm text-gray-300 transition-colors">
                <i class="fas fa-shopping-bag w-5"></i> অর্ডারসমূহ
            </a>
        </nav>
        <button onclick="logout()" class="p-4 bg-red-600 text-center font-bold hover:bg-red-700 transition-colors flex justify-center items-center gap-2">
            <i class="fas fa-sign-out-alt"></i> লগআউট
        </button>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="bg-white shadow-sm border-b p-4 flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-600 focus:outline-none text-xl">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-tachometer-alt text-gray-400 hidden sm:inline"></i> ওভারভিউ
                </h2>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-gray-600 font-medium text-sm bg-gray-100 px-3 py-1 rounded-full border">
                    <i class="fas fa-user-circle text-[#2d5a27] mr-1"></i> Admin
                </span>
            </div>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-4 md:p-6">
            <!-- Stats -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-[#2d5a27]">
                    <h3 class="text-gray-500 text-xs font-bold uppercase tracking-wider">মোট আয়</h3>
                    <p class="text-2xl md:text-3xl font-bold text-gray-800 mt-2" id="statRev">৳ 0</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                    <h3 class="text-gray-500 text-xs font-bold uppercase tracking-wider">মোট অর্ডার</h3>
                    <p class="text-2xl md:text-3xl font-bold text-gray-800 mt-2" id="statOrders">0</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-[#e76f51]">
                    <h3 class="text-gray-500 text-xs font-bold uppercase tracking-wider">পেন্ডিং অর্ডার</h3>
                    <p class="text-2xl md:text-3xl font-bold text-gray-800 mt-2" id="statPending">0</p>
                </div>
            </div>

            <!-- Chart & Table -->
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <!-- Orders Table -->
                <div class="col-span-1 xl:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-gray-100 w-full overflow-hidden">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">সাম্প্রতিক অর্ডারসমূহ</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse whitespace-nowrap">
                            <thead>
                                <tr class="bg-gray-50 text-xs uppercase text-gray-500 border-y">
                                    <th class="p-3 font-semibold">গ্রাহক</th>
                                    <th class="p-3 font-semibold">ঠিকানা</th>
                                    <th class="p-3 font-semibold">পেমেন্ট</th>
                                    <th class="p-3 font-semibold">মোট মূল্য</th>
                                    <th class="p-3 font-semibold">স্ট্যাটাস</th>
                                    <th class="p-3 font-semibold">অ্যাকশন</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody" class="text-sm"></tbody>
                        </table>
                    </div>
                </div>
                
                <!-- Sales Analytics Chart -->
                <div class="col-span-1 bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">সেলস অ্যানালিটিক্স</h3>
                    <div class="relative w-full h-[300px]">
                        <canvas id="salesChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/app.js"></script>
    <script>
        // Sidebar Toggle Logic for Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Check Login
        if(localStorage.getItem('adminToken')) {
            document.getElementById('loginScreen').classList.add('hidden');
            loadAdminData();
        }
    </script>
</body>
</html>
