<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pollirshad</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex h-screen">

    <!-- Login Screen -->
    <div id="loginScreen" class="absolute inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-96 max-w-[90%]">
            <div class="text-center mb-6">
                <i class="fas fa-user-shield text-4xl text-blue-600 mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
            </div>
            
            <!-- Removed exposed credentials from placeholders -->
            <input type="text" id="adminUser" placeholder="Enter Username" class="w-full mb-4 p-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-gray-50">
            <input type="password" id="adminPass" placeholder="Enter Password" class="w-full mb-6 p-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-gray-50">
            
            <button onclick="adminLogin()" class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700 transition duration-200 shadow-md">
                Login
            </button>
        </div>
    </div>

    <!-- Dashboard Sidebar -->
    <div class="w-64 bg-gray-900 text-white flex-col hidden md:flex shadow-xl z-10">
        <div class="p-5 text-2xl font-bold border-b border-gray-800 flex items-center gap-3">
            <i class="fas fa-leaf text-orange-500"></i> Pollirshad
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block py-3 px-4 bg-gray-800 rounded text-sm font-semibold border-l-4 border-orange-500 transition-colors">
                <i class="fas fa-chart-line w-5"></i> Dashboard
            </a>
            <a href="#" class="block py-3 px-4 hover:bg-gray-800 rounded text-sm text-gray-300 transition-colors">
                <i class="fas fa-shopping-bag w-5"></i> Orders
            </a>
            <a href="#" class="block py-3 px-4 hover:bg-gray-800 rounded text-sm text-gray-300 transition-colors">
                <i class="fas fa-users w-5"></i> Vendors
            </a>
        </nav>
        <button onclick="logout()" class="p-4 bg-red-600 text-center font-bold hover:bg-red-700 transition-colors flex justify-center items-center gap-2">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="bg-white shadow-sm border-b p-4 flex justify-between items-center z-10">
            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-tachometer-alt text-gray-400"></i> Overview
            </h2>
            <div class="flex items-center gap-4">
                <span class="text-gray-600 font-medium text-sm bg-gray-100 px-3 py-1 rounded-full border">
                    <i class="fas fa-user-circle text-orange-600 mr-1"></i> Admin
                </span>
                <button onclick="logout()" class="md:hidden text-red-600 font-bold text-sm bg-red-50 px-3 py-1 rounded">Logout</button>
            </div>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                    <h3 class="text-gray-500 text-xs font-bold uppercase tracking-wider">Total Revenue</h3>
                    <p class="text-3xl font-bold text-gray-800 mt-2" id="statRev">৳ 0</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-green-500">
                    <h3 class="text-gray-500 text-xs font-bold uppercase tracking-wider">Total Orders</h3>
                    <p class="text-3xl font-bold text-gray-800 mt-2" id="statOrders">0</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-yellow-500">
                    <h3 class="text-gray-500 text-xs font-bold uppercase tracking-wider">Pending Orders</h3>
                    <p class="text-3xl font-bold text-gray-800 mt-2" id="statPending">0</p>
                </div>
            </div>

            <!-- Chart & Table -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Orders Table -->
                <div class="col-span-1 lg:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">Recent Orders</h3>
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-gray-50 text-xs uppercase text-gray-500 border-y">
                                <th class="p-3 font-semibold">Customer Info</th>
                                <th class="p-3 font-semibold">Delivery Address</th>
                                <th class="p-3 font-semibold">Payment Details</th>
                                <th class="p-3 font-semibold">Total</th>
                                <th class="p-3 font-semibold">Status</th>
                                <th class="p-3 font-semibold text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody" class="text-sm"></tbody>
                    </table>
                </div>
                
                <!-- Sales Analytics Chart (FIXED RESPONSIVENESS) -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2">Sales Analytics</h3>
                    <!-- The relative container with a strict height fixes the Chart.js squish bug -->
                    <div class="relative w-full h-[300px]">
                        <canvas id="salesChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/app.js"></script>
    <script>
        // Check if already logged in securely
        if(localStorage.getItem('adminToken')) {
            document.getElementById('loginScreen').classList.add('hidden');
            loadAdminData();
        }
    </script>
</body>
</html>
