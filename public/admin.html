<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pollirshad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 flex h-screen">

    <!-- Login Screen -->
    <div id="loginScreen" class="absolute inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-bold text-center mb-6">Admin Login</h2>
            <input type="text" id="adminUser" placeholder="Username (Rasel)" class="w-full mb-4 p-2 border rounded">
            <input type="password" id="adminPass" placeholder="Password (12345#)" class="w-full mb-6 p-2 border rounded">
            <button onclick="adminLogin()" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Login</button>
        </div>
    </div>

    <!-- Dashboard Sidebar -->
    <div class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="p-4 text-2xl font-bold border-b border-gray-800">Pollirshad Admin</div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block py-2 px-4 bg-gray-800 rounded">Dashboard</a>
            <a href="#" class="block py-2 px-4 hover:bg-gray-800 rounded">Orders</a>
            <a href="#" class="block py-2 px-4 hover:bg-gray-800 rounded">Vendors</a>
        </nav>
        <button onclick="logout()" class="p-4 bg-red-600 text-center font-bold">Logout</button>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow p-4 flex justify-between">
            <h2 class="text-xl font-bold text-gray-800">Overview</h2>
            <span class="text-gray-600">Welcome, Admin</span>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
            <!-- Stats -->
            <div class="grid grid-cols-3 gap-6 mb-6">
                <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                    <h3 class="text-gray-500 text-sm">Total Revenue</h3>
                    <p class="text-2xl font-bold" id="statRev">৳ 0</p>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
                    <h3 class="text-gray-500 text-sm">Total Orders</h3>
                    <p class="text-2xl font-bold" id="statOrders">0</p>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
                    <h3 class="text-gray-500 text-sm">Pending Orders</h3>
                    <p class="text-2xl font-bold" id="statPending">0</p>
                </div>
            </div>

            <!-- Chart & Table -->
            <div class="grid grid-cols-3 gap-6">
                <div class="col-span-2 bg-white p-4 rounded shadow">
                    <h3 class="font-bold mb-4">Recent Orders</h3>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-sm text-gray-600">
                                <th class="p-2 border">Customer</th>
                                <th class="p-2 border">Total</th>
                                <th class="p-2 border">Status</th>
                                <th class="p-2 border">Action</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody" class="text-sm"></tbody>
                    </table>
                </div>
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="font-bold mb-4">Sales Analytics</h3>
                    <canvas id="salesChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="/app.js"></script>
    <script>
        // Check if already logged in
        if(localStorage.getItem('adminToken')) {
            document.getElementById('loginScreen').classList.add('hidden');
            loadAdminData();
        }
    </script>
</body>
</html>
