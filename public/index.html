<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollirshad | Premium eCommerce</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Meta Pixel Code Mock -->
    <script>
        console.log("Meta Pixel: PageView Tracked");
        function trackPixel(event) { console.log(`Meta Pixel: ${event} Tracked`); }
    </script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-orange-600 text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider"><i class="fas fa-leaf"></i> Pollirshad</h1>
            <div class="hidden md:flex flex-1 mx-6">
                <input type="text" id="searchBar" placeholder="Search products..." class="w-full px-4 py-2 rounded-l-md text-black outline-none">
                <button class="bg-orange-800 px-4 rounded-r-md"><i class="fas fa-search"></i></button>
            </div>
            <div class="flex gap-4 items-center">
                <a href="/admin.html" class="hover:text-orange-200 text-sm"><i class="fas fa-user-shield"></i> Admin</a>
                <button onclick="toggleCart()" class="relative">
                    <i class="fas fa-shopping-cart text-xl"></i>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full px-1.5">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="bg-cover bg-center h-64 flex items-center justify-center text-white" style="background-image: url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1000'); box-shadow: inset 0 0 0 2000px rgba(0,0,0,0.5);">
        <div class="text-center">
            <h2 class="text-4xl font-bold mb-2">100% Pure & Organic</h2>
            <p class="text-lg">Fresh from the village to your doorstep.</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <h3 class="text-2xl font-bold mb-6 border-l-4 border-orange-500 pl-3">Featured Products</h3>
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <!-- Dynamic Products Loading -->
        </div>
    </div>

    <!-- AI Chatbot Widget -->
    <div class="fixed bottom-6 right-6 z-50">
        <button onclick="toggleChat()" class="bg-orange-600 text-white p-4 rounded-full shadow-lg hover:bg-orange-700">
            <i class="fas fa-robot text-xl"></i>
        </button>
        <div id="chatBox" class="hidden absolute bottom-16 right-0 w-80 bg-white shadow-xl rounded-lg border border-gray-200 overflow-hidden">
            <div class="bg-orange-600 text-white p-3 font-bold">AI Support (PollirBot)</div>
            <div id="chatMessages" class="h-64 overflow-y-auto p-4 bg-gray-50 text-sm">
                <div class="mb-2"><strong>Bot:</strong> Hello! How can I help you with your order today?</div>
            </div>
            <div class="flex border-t border-gray-200">
                <input type="text" id="chatInput" class="flex-1 p-2 outline-none" placeholder="Type a message...">
                <button onclick="sendMessage()" class="bg-orange-600 text-white px-4"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Cart Slide Panel -->
    <div id="cartPanel" class="fixed top-0 right-0 w-80 h-full bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="bg-gray-100 p-4 flex justify-between items-center border-b">
            <h2 class="text-xl font-bold">Your Cart</h2>
            <button onclick="toggleCart()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-4"></div>
        <div class="p-4 border-t bg-gray-50">
            <div class="flex justify-between font-bold text-lg mb-4"><span>Total:</span> <span id="cartTotal">৳ 0</span></div>
            <button onclick="openCheckout()" class="w-full bg-orange-600 text-white py-3 rounded-md font-bold hover:bg-orange-700">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-md max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-bold mb-4">Checkout</h2>
            <input type="text" id="cName" placeholder="Full Name" class="w-full mb-3 p-2 border rounded">
            <input type="text" id="cPhone" placeholder="Phone Number" class="w-full mb-3 p-2 border rounded">
            <textarea id="cAddress" placeholder="Delivery Address" class="w-full mb-3 p-2 border rounded"></textarea>
            
            <select id="paymentMethod" class="w-full mb-3 p-2 border rounded" onchange="togglePayment()">
                <option value="COD">Cash on Delivery</option>
                <option value="bKash">bKash (017XXXXX)</option>
                <option value="Nagad">Nagad</option>
            </select>
            
            <div id="paymentDetails" class="hidden mb-3 bg-orange-50 p-3 rounded border border-orange-200">
                <p class="text-xs text-orange-800 mb-2">Send money to 017XXXXXXXX and enter TrxID below.</p>
                <input type="text" id="trxId" placeholder="Transaction ID" class="w-full p-2 border rounded">
            </div>

            <div class="flex gap-2">
                <button onclick="closeCheckout()" class="flex-1 bg-gray-300 py-2 rounded">Cancel</button>
                <button onclick="placeOrder()" class="flex-1 bg-green-600 text-white py-2 rounded font-bold">Confirm Order</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
