services:
  - type: web
    name: pollirshad-ecommerce
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        fromDatabase:
          name: pollirshad-secret
          type: password
      - key: MONGO_URI
        fromDatabase:
          name: pollirshad-db
          type: connection-string
    healthCheckPath: /api/health
    plan: free

databases:
  - name: pollirshad-db
    type: mongodb
    plan: free